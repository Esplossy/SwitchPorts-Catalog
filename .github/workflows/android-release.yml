name: Build signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and URL policy
        run: pnpm verify

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p dist
          zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk dist/SwitchPorts-Catalog-release-aligned.apk
          apksigner sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out dist/SwitchPorts-Catalog-release.apk dist/SwitchPorts-Catalog-release-aligned.apk
          apksigner verify --verbose dist/SwitchPorts-Catalog-release.apk
          sha256sum dist/SwitchPorts-Catalog-release.apk > dist/SwitchPorts-Catalog-release.apk.sha256
          rm -f release.keystore dist/SwitchPorts-Catalog-release-aligned.apk

      - name: Upload signed release and checksum
        uses: actions/upload-artifact@v7
        with:
          name: SwitchPorts-Catalog-release
          path: dist/*
          if-no-files-found: error
